<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion MNIST Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; }
        input[type="file"] { margin: 20px 0; }
        input[type="submit"] { background: #007BFF; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background: #0056b3; }
        .result { margin-top: 20px; font-size: 1.2em; color: #333; }
        img { margin-top: 15px; border: 1px solid #ddd; border-radius: 4px; width: 150px; height: 150px; object-fit: contain; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👕 Fashion MNIST Classifier</h2>
        <p>Upload a clothing image (ideally a 28x28 grayscale item like a shoe, shirt, or bag) to classify it.</p>
        
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required><br>
            <input type="submit" value="Classify Image">
        </form>

        {% if prediction %}
            <div class="result">
                <h3>Prediction: <span style="color: #007BFF;">{{ prediction }}</span></h3>
                <p>Confidence: {{ confidence }}</p>
                <img src="{{ image_path }}" alt="Uploaded Image">
            </div>
        {% endif %}
    </div>
</body>
</html>
